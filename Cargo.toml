[package]
name = "sentinel-firmware"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sentinels-Today/sentinel-firmware"
homepage = "https://sentinels.today"
authors = ["Sentinel Labs <admin@sentinels.today>"]
description = "Reference TPM 2.0 measured-boot data model and quote verification for Sentinel Labs."
rust-version = "1.75"
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = { version = "1.0", optional = true }

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["std"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
